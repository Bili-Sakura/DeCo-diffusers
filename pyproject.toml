[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusers-deco"
version = "0.2.0"
description = "Diffusers-style DeCo pixel diffusion components."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "diffusers>=0.30.1",
    "torch",
    "torchvision",
    "safetensors",
]

[project.optional-dependencies]
dev = ["pytest"]
demo = ["gradio"]

[tool.setuptools.packages.find]
where = ["src"]
